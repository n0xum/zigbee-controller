mqtt:
  broker: "tcp://localhost:1883"
  client_id: "zigbee-controller"
  username: ""
  password: ""

homekit:
  pin: "11122333"
  name: "Zigbee Bridge"
  storage_path: "./hap-data"
  # Auf welchen Netzwerkschnittstellen die Bridge per mDNS angekuendigt wird.
  # Weglassen oder leer lassen = alle (Standardverhalten von dnssd).
  #
  # Im Docker-host-Netzmodus unbedingt setzen: der Container sieht sonst auch
  # alle Docker-Bridges und das Loopback und kuendigt die Bridge dort mit
  # 172.x- bzw. 127.0.0.1-Adressen an, die vom LAN aus unerreichbar sind.
  # iOS probiert die Adressen durch und bricht bei den falschen ab -- die
  # Bridge erscheint dann sporadisch als "keine Antwort".
  interfaces: ["eth0"]

devices:
  bulbs:
    - friendly_name: "kajplats_1"
      display_name: "Wohnzimmer Lampe"
    - friendly_name: "kajplats_2"
      display_name: "Schlafzimmer Lampe"
  remotes:
    - friendly_name: "bilresa_1"
      display_name: "BILRESA Scrollrad"
      controls_bulbs: ["kajplats_1", "kajplats_2"]
