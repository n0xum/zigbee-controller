name: CI/CD

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/n0xum/zigbee-controller:latest
            ghcr.io/n0xum/zigbee-controller:${{ github.sha }}

# Bewusst kein automatischer Deploy-Schritt.
#
# Der Zielhost ist ein NAS im Heimnetz ohne eingehende Ports aus dem Internet.
# GitHub-Runner koennen ihn nicht erreichen; der frueher hier stehende
# appleboy/ssh-action scheiterte entsprechend ("missing server host"). Ihn zum
# Laufen zu bringen hiesse, SSH ins Internet zu stellen -- das waere ein
# Rueckschritt gegenueber dem Tunnel-only-Ingress.
#
# Der Dienst ist ausserdem zustandsbehaftet (HomeKit-Pairings unter hap-data)
# und traegt deshalb auf dem NAS bewusst watchtower.enable=false. Eine neue
# Version wird dort absichtlich eingespielt, mit Rueckfallmoeglichkeit:
#
#     cd /volume1/docker/compose/apps/zigbee && ./update.sh
#
# Diese Pipeline endet daher beim veroeffentlichten Image in ghcr.io.
